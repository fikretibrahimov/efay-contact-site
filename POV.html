      width: 30px;
      height: 30px;
      display: block;
      object-fit: contain;

    .icon img {

      height: 100%;

      object-fit: contain;
      border-radius: 0;

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 14px;
      background: #101010;
      z-index: 10;
    }

    .bottom a {

      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 62px;

      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      border-bottom: none;
      text-underline-offset: 0;
    }

    .bottom a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.26);
      filter: brightness(1.04);
    }

    .bottom a:nth-child(2) {
      background: linear-gradient(135deg, #3a3a3a 0%, #2c2c2c 100%);
    }

    .bottom a:nth-child(3) {
      background: linear-gradient(135deg, #16a34a 0%, #0f8d3d 100%);
    }

    @media (max-width: 360px) {
      .bottom {
        gap: 6px;
        padding: 10px 8px;
      }

      .bottom a {
        font-size: 12px;
        padding: 13px 6px;
      }
    }
